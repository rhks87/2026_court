name: Tennis Court Updater

on:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:

concurrency:
  group: tennis-court-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests openpyxl

      - name: 데이터 수집 + HTML 생성
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html previous_slots.json weather_cache.json
          if [ -f pending_notify.json ]; then
            git add pending_notify.json
          elif git ls-files --error-unmatch pending_notify.json > /dev/null 2>&1; then
            git rm --cached pending_notify.json > /dev/null
          fi
          git diff --staged --quiet || git commit -m "자동 갱신 $(date '+%Y-%m-%d %H:%M')"

          # push 재시도 — 원격 충돌/GitHub 서버 일시 오류 대비 (최대 5회, 점점 늘어나는 대기시간)
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 실패, 재시도 $i/5"
            sleep $((i * 5))
          done
          echo "push 5회 모두 실패"
          exit 1
