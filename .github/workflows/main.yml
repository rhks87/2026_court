name: Tennis Court Updater

on:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:

concurrency:
  group: tennis-court-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests openpyxl

      - name: 데이터 수집 + HTML 생성
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html previous_slots.json weather_cache.json midterm_cache.json warn_cache.json
          if [ -f pending_notify.json ]; then
            git add pending_notify.json
          elif git ls-files --error-unmatch pending_notify.json > /dev/null 2>&1; then
            git rm --cached pending_notify.json > /dev/null
          fi
          git diff --staged --quiet || git commit -m "자동 갱신 $(date '+%Y-%m-%d %H:%M')"

          # push 재시도 — 자동 생성 파일(index.html 등)은 충돌 시 항상 방금 만든
          # 최신 버전을 우선(-X ours)해서 사람 개입 없이 자동 해결
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main; then
              if git push; then
                echo "push 성공 (시도 $i)"
                exit 0
              fi
            else
              echo "merge 실패 — abort 후 재시도"
              git merge --abort || true
            fi
            echo "재시도 $i/5"
            sleep $((i * 5))
          done
          echo "5회 모두 실패"
          exit 1
